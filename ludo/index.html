<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
<style>
/* VOICE: warm and playful, a game night with a friend
   IDEA: a wooden ludo box on the table, your corner always nearest you
   PICTURE: the board, large, with glossy pawns
   COLOUR and TYPE: walnut table, white board, classic four colours; Baloo 2 + Nunito
   LAYOUT: friend's die top right, board, your die bottom left */
:root{color-scheme:dark;--bg:#24160d;--wood:#6b4125;--wood2:#4a2b17;--ink:#fff6ea;--muted:#dcc6ae;--card:#33200f;--line:#5c3b22;--B:#2364d2;--G:#1f9d55;--Y:#f2b200}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 30% 0%,#4a2c18 0%,var(--bg) 60%);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.col{width:min(100% - 24px,max(300px,calc(100svh - 250px)),640px);margin:0 auto;padding:12px 0 24px;display:flex;flex-direction:column;gap:12px}
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:80px}
.row.top{justify-content:space-between}
.row.bot{justify-content:space-between}
.seat{display:flex;align-items:center;gap:10px}
.tag{font:800 17px/1 "Baloo 2",sans-serif;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.chip b{font:800 20px/1 "Baloo 2",sans-serif;letter-spacing:3px}
.frame{aspect-ratio:1;width:100%;padding:clamp(8px,1.8vw,14px);background:linear-gradient(145deg,var(--wood),var(--wood2));border-radius:18px;box-shadow:0 24px 50px #0008,inset 0 2px 0 #ffffff22}
#board{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 0 0 2px #00000055;transition:transform .5s}
#board.flip{transform:rotate(180deg)}
.die{width:76px;height:76px;flex:none;border-radius:17px;background:#fff;border:5px solid var(--tc,#bbb);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:3px;box-shadow:0 6px 0 #00000066;cursor:pointer;transition:opacity .25s,transform .25s}
.die i{border-radius:50%;background:#1b1b1b;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.die i.on{opacity:1;transform:scale(1)}
.die:disabled{cursor:default}
.die.off{opacity:.3;transform:scale(.84)}
.die.go{animation:bob 1.1s ease-in-out infinite}
.die.spin{animation:spin .55s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.78)}100%{transform:rotate(360deg) scale(1)}}
.tools{display:flex;gap:8px}
.ic{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ic[aria-pressed=true]{border-color:var(--Y)}
.emobar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.emobar button{width:48px;height:48px;border:0;border-radius:12px;background:transparent;font-size:30px;line-height:1;cursor:pointer;padding:0;transition:transform .12s}
.emobar button:active{transform:scale(1.25)}
.pop{position:absolute;pointer-events:none;font-size:64px;line-height:1;z-index:4;filter:drop-shadow(0 6px 8px #0007);animation:pop 2.2s ease-out forwards}
.row.bot .pop{left:84px;bottom:20px}.row.top .pop{right:84px;top:20px}
@keyframes pop{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.35);opacity:1}24%{transform:scale(1)}80%{opacity:1;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-30px)}}
.btn{font:800 16px/1 Nunito,sans-serif;min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--Y);border-color:var(--Y);color:#2a180b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.die:focus-visible,.btn:focus-visible,input:focus-visible,.link:focus-visible,.ic:focus-visible,.emobar button:focus-visible{outline:3px solid var(--Y);outline-offset:3px}
.link{background:none;border:0;text-decoration:underline;font:700 15px Nunito,sans-serif;cursor:pointer;min-height:44px;padding:0 4px}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px}
.note{color:#ffb4a8;font-size:14px;margin:0;text-align:center}.note:empty{display:none}
.tok{transition:transform .14s ease-out}
.still .tok{transition:none}
.tok .ring{opacity:0}
.tok.can{cursor:pointer}
.tok.can .ring{opacity:1;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.lobby{position:fixed;inset:0;background:#160d07cc;backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:5}
.lcard{width:min(420px,100%);background:#fff6ea;color:#2a180b;border-radius:22px;padding:26px 24px 16px;box-shadow:0 30px 60px #000a;display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:8px}.dots i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -4px 0 #0003}
.join{display:flex;gap:8px}
.join input{flex:1;font:800 22px/1 "Baloo 2",sans-serif;letter-spacing:4px;text-transform:uppercase;text-align:center;min-height:50px;border-radius:12px;border:2px solid #cdb79f;background:#fff;color:#2a180b;padding:0 10px}
.join input::placeholder{letter-spacing:1px;font-size:17px;color:#a58c74}
.lcard .btn{border-color:#2a180b;background:#2a180b;color:#fff6ea}
.lcard .btn.primary{background:var(--B);border-color:var(--B);color:#fff}
.lnote{color:#a3271f;font-weight:700;font-size:15px;margin:0}.lnote:empty{display:none}
.lcard .link{color:#6b4a30}
.lrow{display:flex;justify-content:space-between;flex-wrap:wrap}
@media(max-width:400px){.die{width:66px;height:66px;padding:9px}.row{min-height:70px}.ic{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){.tok,.die i,#board{transition:none}.die.go,.die.spin,.tok.can .ring{animation:none}}
</style></head><body>
<div class="col">
  <div class="row top" id="rowTop">
    <div class="chip" id="codechip" hidden><b id="codetxt"></b><button class="btn" id="copy" style="min-height:36px;padding:0 12px">Invite</button></div>
    <span></span>
    <div class="seat"><span class="tag" id="tagTop">Friend</span><button class="die" id="dieTop" aria-label="Friend's die" disabled></button></div>
  </div>
  <div class="frame"><svg id="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board"></svg></div>
  <div class="row bot" id="rowBot">
    <div class="seat"><button class="die" id="dieBot" aria-label="Your die" disabled></button><span class="tag" id="tagBot">You</span></div>
    <div class="tools"><button class="ic" id="emoBtn" aria-label="Send an emoji" aria-pressed="false">😜</button><button class="ic" id="muteBtn" aria-label="Sound on or off">🔊</button></div>
  </div>
  <div class="emobar" id="emobar" hidden></div>
  <div class="foot"><p class="note" id="note"></p><button class="btn primary" id="again" hidden>Play again</button></div>
</div>
<div class="lobby" id="lobby">
  <div class="lcard">
    <div class="dots"><i style="background:#e0362f"></i><i style="background:#1f9d55"></i><i style="background:#f2b200"></i><i style="background:#2364d2"></i></div>
    <button class="btn primary" id="create">Create a game</button>
    <form class="join" id="joinf"><input id="codein" maxlength="5" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button class="btn" id="joinb">Join</button></form>
    <p class="lnote" id="lnote" role="status"></p>
    <div class="lrow"><button class="link" id="resume" hidden>Resume game</button><button class="link" id="localb">One device</button></div>
  </div>
</div>
<script>
{
const $=s=>document.querySelector(s);
const COL={r:'#e0362f',g:'#1f9d55',y:'#f2b200',b:'#2364d2'};
const DARK={b:'#123f8f',g:'#0c5c30'};
const NAME={b:'Blue',g:'Green'};
const OFF={b:39,g:13},OTH={b:'g',g:'b'},CS=['b','g'];
const CODESET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const EMPTY={b:[-1,-1,-1,-1],g:[-1,-1,-1,-1]};
// 52-square main track as [row,col], index 0 = top-left arm start square
const T=[];
const run=(a,b,f)=>{const st=a<=b?1:-1;for(let k=a;st>0?k<=b:k>=b;k+=st)T.push(f(k))};
run(1,5,c=>[6,c]);run(5,0,r=>[r,6]);T.push([0,7]);run(0,5,r=>[r,8]);run(9,14,c=>[6,c]);T.push([7,14]);
run(14,9,c=>[8,c]);run(9,14,r=>[r,8]);T.push([14,7]);run(14,9,r=>[r,6]);run(5,0,c=>[8,c]);T.push([7,0]);T.push([6,0]);
const HOME={r:[1,2,3,4,5].map(c=>[7,c]),y:[13,12,11,10,9].map(c=>[7,c]),g:[1,2,3,4,5].map(r=>[r,7]),b:[13,12,11,10,9].map(r=>[r,7])};
const STARTS={0:'r',13:'g',26:'y',39:'b'};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const BASE={b:[[2,11],[4,11],[2,13],[4,13]],g:[[11,2],[13,2],[11,4],[13,4]]};
const FIN={b:[[7.05,8.62],[7.95,8.62],[7.5,8.62],[7.5,8.12]]};FIN.g=FIN.b.map(([x,y])=>[15-x,15-y]);

function rid(n,set='abcdefghijkmnpqrstuvwxyz23456789'){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,v=>set[v%set.length]).join('')}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const me=store.get('ludo-me')||(()=>{const id=rid(14);store.set('ludo-me',id);return id})();
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- sound (synthesised, no files) ---------- */
let AC=null,muted=store.get('ludo-mute')==='1';
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
document.addEventListener('pointerdown',ac,{passive:true});
function tone(f,d,o={}){const a=ac();if(!a||muted)return;const t=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g).connect(a.destination);os.start(t);os.stop(t+d+.03)}
function noise(d,o={}){const a=ac();if(!a||muted)return;const t=a.currentTime+(o.at||0),n=Math.max(1,Math.floor(a.sampleRate*d)),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let k=0;k<n;k++)ch[k]=(Math.random()*2-1)*Math.pow(1-k/n,o.decay||1);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type='bandpass';f.frequency.value=o.freq||2000;f.Q.value=o.q||1;g.gain.value=o.vol||.3;
  s.connect(f).connect(g).connect(a.destination);s.start(t)}
const SFX={
  roll(){for(let k=0;k<7;k++)noise(.05,{at:k*.06,freq:1600+Math.random()*1800,q:4,vol:.9,decay:3})},
  step(){tone(620,.07,{type:'triangle',vol:.16})},
  out(){tone(330,.16,{type:'triangle',vol:.25,slide:2.4})},
  capture(){tone(760,.4,{type:'sawtooth',vol:.12,slide:.2});noise(.3,{at:.08,freq:260,q:.8,vol:1.2})},
  home(){[523,659,784,1047].forEach((f,k)=>tone(f,.2,{type:'triangle',vol:.2,at:k*.09}))},
  turn(){tone(880,.12,{vol:.16});tone(1320,.2,{vol:.13,at:.1})},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,k)=>tone(f,.28,{type:'square',vol:.07,at:k*.14}))}
};
const EMO=[
  ['😂',()=>{for(let k=0;k<5;k++)tone(620-k*30,.1,{type:'square',vol:.07,at:k*.12,slide:.75})}],
  ['😎',()=>{tone(392,.55,{type:'sawtooth',vol:.05,slide:1.5});tone(494,.55,{type:'sawtooth',vol:.05,slide:1.5});tone(587,.55,{type:'sawtooth',vol:.04,slide:1.5})}],
  ['😜',()=>{tone(180,.45,{vol:.3,slide:5});tone(900,.3,{vol:.12,slide:.3,at:.42})}],
  ['😡',()=>{tone(98,.6,{type:'sawtooth',vol:.16});tone(104,.6,{type:'sawtooth',vol:.16});noise(.5,{freq:200,q:.7,vol:.5})}],
  ['😭',()=>{tone(760,.55,{type:'triangle',vol:.18,slide:.55});tone(680,.7,{type:'triangle',vol:.18,slide:.5,at:.5})}],
  ['🔥',()=>{noise(.7,{freq:700,q:.4,vol:1.1,decay:.6});tone(220,.6,{type:'sawtooth',vol:.05,slide:3})}],
  ['👏',()=>{for(let k=0;k<5;k++)noise(.07,{at:k*.13,freq:1400,q:1,vol:1.4,decay:4})}],
  ['💀',()=>{tone(160,.7,{type:'square',vol:.1,slide:.35});tone(120,.7,{type:'square',vol:.08,slide:.35,at:.12})}],
  ['🤣',()=>{for(let k=0;k<7;k++)tone(700+(k%2)*140,.08,{type:'square',vol:.06,at:k*.09})}],
  ['👋',()=>{tone(1200,.22,{vol:.14,slide:1.6});tone(1900,.32,{vol:.12,slide:.6,at:.22})}]
];

/* ---------- board ---------- */
const svg=$('#board');
const rect=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const cell=(r,c,f)=>`<rect x="${c}" y="${r}" width="1" height="1" fill="${f}" stroke="#2b2b2b" stroke-width=".035"/>`;
const star=(cx,cy,R,f)=>{let p='';for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.45:R;p+=`${(cx+Math.cos(a)*rr).toFixed(3)},${(cy+Math.sin(a)*rr).toFixed(3)} `}return`<polygon points="${p}" fill="${f}"/>`};
let h=rect(0,0,15,15,'#fff');
[['r',0,0],['g',9,0],['y',9,9],['b',0,9]].forEach(([c,x,y])=>{
  h+=rect(x,y,6,6,COL[c])+rect(x+1,y+1,4,4,'#fff','rx=".35"');
  [[2,2],[4,2],[2,4],[4,4]].forEach(([a,b])=>{h+=`<circle cx="${x+a}" cy="${y+b}" r=".58" fill="${COL[c]}" opacity=".22" stroke="${COL[c]}" stroke-width=".07"/>`});
});
T.forEach(([r,c],i)=>{h+=cell(r,c,STARTS[i]?COL[STARTS[i]]:'#fff')});
for(const k in HOME)HOME[k].forEach(([r,c])=>{h+=cell(r,c,COL[k])});
SAFE.forEach(i=>{const[r,c]=T[i];h+=star(c+.5,r+.5,.36,STARTS[i]?'rgba(255,255,255,.85)':'#b9b9b9')});
h+=`<polygon points="6,6 6,9 7.5,7.5" fill="${COL.r}"/><polygon points="6,6 9,6 7.5,7.5" fill="${COL.g}"/><polygon points="9,6 9,9 7.5,7.5" fill="${COL.y}"/><polygon points="6,9 9,9 7.5,7.5" fill="${COL.b}"/>`;
h+=`<path d="M6 6L9 9M9 6L6 9" stroke="#2b2b2b" stroke-width=".035"/><rect x="0" y="0" width="15" height="15" fill="none" stroke="#2b2b2b" stroke-width=".08"/><g id="toks" class="still"></g>`;
svg.innerHTML=h;
const layer=$('#toks'),TK={};
CS.forEach(c=>{TK[c]=[0,1,2,3].map(i=>{
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','tok');
  g.innerHTML=`<circle r=".62" fill="transparent"/><ellipse cx="0" cy=".34" rx=".3" ry=".09" fill="rgba(0,0,0,.32)"/><circle class="ring" cy=".04" r=".5" fill="none" stroke="#111" stroke-width=".08"/>`+
    `<path d="M-.27 .33Q-.27 .12-.09-.02L.09-.02Q.27 .12 .27 .33Z" fill="${COL[c]}" stroke="${DARK[c]}" stroke-width=".05"/><circle cy="-.16" r=".17" fill="${COL[c]}" stroke="${DARK[c]}" stroke-width=".05"/><circle cx="-.06" cy="-.21" r=".055" fill="#fff" opacity=".85"/><path d="M-.15 .2Q0 .26 .15 .2" stroke="#fff" stroke-width=".03" fill="none" opacity=".5"/>`;
  g.addEventListener('click',()=>onTok(c,i));layer.appendChild(g);return g})});

/* ---------- game state ---------- */
let S=null,DP=null,mode=null,code=null,shownRoll=-1,stepT=null;
const fresh=seats=>({v:1,seats,turn:'b',by:'b',dice:0,dv:{b:0,g:0},rollId:0,rolled:false,sixes:0,tk:clone(EMPTY),winner:null,ts:Date.now()});
const mine=c=>mode==='local'||(!!S&&S.seats[c]===me);
const myColor=()=>mode!=='online'||!S?null:S.seats.b===me?'b':S.seats.g===me?'g':null;
const bottom=()=>myColor()||'b';
const ready=()=>!!S&&(mode==='local'||(!!S.seats.b&&!!S.seats.g));
const canAct=()=>ready()&&!S.winner&&mine(S.turn);
const movable=(s,c,d)=>s.tk[c].map((p,i)=>(p<0?d===6:p+d<=56)?i:-1).filter(i=>i>=0);
const pass=s=>{s.turn=OTH[s.turn];s.rolled=false;s.sixes=0};
function pos(c,p,i){
  if(p<0)return BASE[c][i];
  if(p<=50){const[r,cc]=T[(OFF[c]+p)%52];return[cc+.5,r+.5]}
  if(p<=55){const[r,cc]=HOME[c][p-51];return[cc+.5,r+.5]}
  return FIN[c][i];
}

function apply(next){
  const prev=S;S=next;
  if(!prev||next.dice===0||!DP)DP=clone(next.tk);
  else{
    if(next.rollId!==prev.rollId)SFX.roll();
    if(next.winner&&!prev.winner)setTimeout(SFX.win,900);
    else if(mode==='online'&&prev.turn!==next.turn&&mine(next.turn)&&!next.winner)setTimeout(SFX.turn,700);
  }
  render();
}
function commit(s){s.v=(S?S.v||0:0)+1;s.ts=Date.now();apply(s);if(mode==='online')publish(s)}

function roll(){
  if(!canAct()||S.rolled)return;
  const s=clone(S),c=s.turn,d=1+crypto.getRandomValues(new Uint32Array(1))[0]%6;
  s.dice=d;s.by=c;s.dv=Object.assign({b:0,g:0},s.dv);s.dv[c]=d;s.rollId++;s.sixes=d===6?s.sixes+1:0;
  if(s.sixes===3)pass(s);
  else{const m=movable(s,c,d);
    if(!m.length)pass(s);
    else{s.rolled=true;
      if(new Set(m.map(i=>s.tk[c][i])).size===1){const id=s.rollId;setTimeout(()=>{if(S&&S.rollId===id&&S.rolled)move(m[0])},750)}}}
  commit(s);
}
function move(i){
  if(!canAct()||!S.rolled)return;
  const c=S.turn,d=S.dice;if(!movable(S,c,d).includes(i))return;
  const s=clone(S),p=s.tk[c][i],np=p<0?0:p+d;s.tk[c][i]=np;let cap=0;
  if(np<=50){const a=(OFF[c]+np)%52;if(!SAFE.has(a)){const o=OTH[c];s.tk[o]=s.tk[o].map(q=>q>=0&&q<=50&&(OFF[o]+q)%52===a?(cap++,-1):q)}}
  s.rolled=false;
  if(s.tk[c].every(q=>q===56))s.winner=c;
  else if(!(d===6||cap||np===56))pass(s);
  commit(s);
}
function onTok(c,i){if(S&&S.turn===c&&S.rolled&&canAct())move(i)}

/* ---------- token animation: one square at a time ---------- */
function tick(){
  const t=S?S.tk:EMPTY;let moving=false,done=true;
  CS.forEach(c=>t[c].forEach((z,i)=>{const a=DP[c][i];if(a===z)return;done=false;
    if(z>=0&&a>=0&&z>a&&z-a<=6){DP[c][i]=a+1;moving=true;SFX.step();if(a+1===56)SFX.home()}
    else if(a<0&&z===0){DP[c][i]=0;moving=true;SFX.out()}
    else if(!(z<0&&a>=0)){DP[c][i]=z;moving=true}}));
  if(!moving){let cap=false;CS.forEach(c=>t[c].forEach((z,i)=>{if(z<0&&DP[c][i]>=0){DP[c][i]=-1;cap=true}}));if(cap)SFX.capture()}
  if(done){clearInterval(stepT);stepT=null}
  place();
}
function animate(){if(!DP)DP=clone(S?S.tk:EMPTY);if(!stepT){stepT=setInterval(tick,170);tick()}}

/* ---------- rendering ---------- */
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DIE={bot:$('#dieBot'),top:$('#dieTop')};
for(const k in DIE){DIE[k].innerHTML='<i></i>'.repeat(9);DIE[k].addEventListener('click',()=>{const c=k==='bot'?bottom():OTH[bottom()];if(S&&S.turn===c)roll()})}
function place(){
  const tk=DP||EMPTY,groups={},all=[],flip=bottom()==='g';
  CS.forEach(c=>tk[c].forEach((p,i)=>{const[x,y]=pos(c,p,i);const k=p<0||p===56?c+i+'_'+p:x+','+y;(groups[k]=groups[k]||[]).push(c+i);all.push([c,i,x,y,k,p])}));
  const mv=S&&S.rolled&&canAct()&&!stepT?movable(S,S.turn,S.dice):[];
  all.forEach(([c,i,x,y,k,p])=>{
    const gr=groups[k],g=TK[c][i];let dx=0,dy=0,sc=p===56?.6:1;
    if(gr.length>1){const a=gr.indexOf(c+i)/gr.length*Math.PI*2+Math.PI/4;dx=Math.cos(a)*.22;dy=Math.sin(a)*.22;sc=.72}
    g.style.transform=`translate(${(x+dx).toFixed(3)}px,${(y+dy).toFixed(3)}px) rotate(${flip?180:0}deg) scale(${sc})`;
    const can=!!S&&S.turn===c&&mv.includes(i);
    if(can&&!g.classList.contains('can'))layer.appendChild(g);
    g.classList.toggle('can',can);
  });
}
function render(){
  const bc=bottom(),tc=OTH[bc];
  svg.classList.toggle('flip',bc==='g');
  const canRoll=!!S&&canAct()&&!S.rolled;
  [['bot',bc],['top',tc]].forEach(([k,c])=>{const d=DIE[k],v=S&&S.dv?S.dv[c]||0:0,active=!!S&&!S.winner&&ready()&&S.turn===c;
    d.style.setProperty('--tc',COL[c]);
    [...d.children].forEach((p,j)=>p.classList.toggle('on',PIPS[v].includes(j)));
    d.classList.toggle('off',!active);d.disabled=!(canRoll&&active);d.classList.toggle('go',canRoll&&active);
    if(S&&shownRoll!==-1&&S.rollId!==shownRoll&&S.by===c){d.classList.remove('spin');void d.offsetWidth;d.classList.add('spin')}});
  shownRoll=S?S.rollId:-1;
  $('#tagBot').textContent=mode==='local'?NAME[bc]:'You';
  $('#tagTop').textContent=mode==='local'?NAME[tc]:(mode==='online'&&S&&!S.seats.g?'':'Friend');
  $('#codechip').hidden=!(mode==='online'&&S&&!S.seats.g);
  $('#again').hidden=!(S&&S.winner&&(mode==='local'||myColor()));
  $('#emoBtn').hidden=!S;
  animate();place();
}
const note=t=>{$('#note').textContent=t||''};
const lnote=t=>{$('#lnote').textContent=t||''};
const busyL=b=>{$('#create').disabled=b;$('#joinb').disabled=b};

/* ---------- emoji taunts ---------- */
const bar=$('#emobar');
bar.innerHTML=EMO.map(([e],k)=>`<button data-k="${k}" aria-label="Send ${e}">${e}</button>`).join('');
let lastEmo=0;const seenFx=new Set();
function showEmo(k,seat){const e=EMO[k];if(!e)return;const row=seat==='bot'?$('#rowBot'):$('#rowTop');
  const p=document.createElement('div');p.className='pop';p.textContent=e[0];row.appendChild(p);setTimeout(()=>p.remove(),2300);e[1]()}
bar.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const now=Date.now();if(now-lastEmo<1200)return;lastEmo=now;
  const k=+b.dataset.k;showEmo(k,'bot');bar.hidden=true;$('#emoBtn').setAttribute('aria-pressed','false');
  if(mode==='online'){const id=rid(8);seenFx.add(id);sendFx({id,k,from:bottom()})}});
$('#emoBtn').addEventListener('click',()=>{bar.hidden=!bar.hidden;$('#emoBtn').setAttribute('aria-pressed',String(!bar.hidden))});
const setMute=()=>{$('#muteBtn').textContent=muted?'🔇':'🔊'};setMute();
$('#muteBtn').addEventListener('click',()=>{muted=!muted;store.set('ludo-mute',muted?'1':'0');setMute();if(!muted)SFX.turn()});

/* ---------- online sync: public MQTT relay, two brokers for safety ---------- */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let clients=[],topic=null,joinWait=null;
function netClose(){clients.forEach(c=>{try{c.end(true)}catch(e){}});clients=[];topic=null}
function netOpen(c){
  netClose();topic='ludo2p/v2/'+c;const fx=topic+'/fx';
  clients=BROKERS.map(u=>{const m=mqtt.connect(u,{clientId:'ludo_'+rid(12),clean:true,connectTimeout:8000,reconnectPeriod:2500,keepalive:30});
    m.on('connect',()=>{m.subscribe([topic,fx],{qos:1});if(m.pend){const x=m.pend;m.pend=null;m.publish(topic,x,{qos:1,retain:true})}});
    m.on('message',(t,buf)=>{let d;try{d=JSON.parse(buf.toString())}catch(e){return}
      if(t===fx){if(!d||seenFx.has(d.id))return;seenFx.add(d.id);if(d.from!==bottom())showEmo(+d.k,'top');return}
      if(t!==topic||!d||!d.tk||!d.seats)return;onRemote(d)});
    m.on('error',()=>{});return m});
}
function publish(s){const msg=JSON.stringify(s);clients.forEach(m=>{if(!m.connected){m.pend=msg;return}try{m.publish(topic,msg,{qos:1,retain:true})}catch(e){m.pend=msg}})}
function sendFx(o){const msg=JSON.stringify(o);clients.forEach(m=>{try{if(m.connected)m.publish(topic+'/fx',msg,{qos:0})}catch(e){}})}
function onRemote(d){
  if(joinWait){const f=joinWait;joinWait=null;f(d);return}
  if(S&&(d.v||0)<=(S.v||0))return;
  apply(clone(d));
}
function create(){
  ac();if(!window.mqtt){lnote('Could not load the online part. Check your internet and reload.');return}
  const c=rid(5,CODESET);mode='online';code=c;store.set('ludo-last',c);S=null;DP=null;
  netOpen(c);const s=fresh({b:me,g:null});apply(s);publish(s);show(c);
}
function join(raw){
  ac();const c=(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(c)){lnote('A game code is 5 letters or numbers.');return}
  if(!window.mqtt){lnote('Could not load the online part. Check your internet and reload.');return}
  lnote('Joining...');busyL(true);S=null;DP=null;mode='online';code=c;
  const timer=setTimeout(()=>{if(joinWait){joinWait=null;netClose();mode=null;busyL(false);lnote('No game found with that code.')}},9000);
  joinWait=d=>{clearTimeout(timer);busyL(false);lnote('');
    if(d.seats.b!==me&&d.seats.g!==me){
      if(d.seats.g){apply(clone(d));show(c);note('This game already has two players. You are watching.');return}
      const s=clone(d);s.seats.g=me;s.v=(d.v||0)+1;apply(s);publish(s)}
    else apply(clone(d));
    store.set('ludo-last',c);show(c)};
  netOpen(c);
}
function show(c){$('#lobby').hidden=true;$('#codetxt').textContent=c;try{history.replaceState(null,'','#'+c)}catch(e){}render();settle()}
function startLocal(){ac();netClose();mode='local';code=null;S=null;DP=null;note('');apply(fresh({b:'local',g:'local'}));$('#lobby').hidden=true;render();settle()}
function settle(){requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.remove('still')))}

$('#create').addEventListener('click',create);
$('#joinf').addEventListener('submit',e=>{e.preventDefault();join($('#codein').value)});
$('#codein').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
$('#localb').addEventListener('click',startLocal);
$('#resume').addEventListener('click',()=>join(store.get('ludo-last')));
$('#again').addEventListener('click',()=>{if(!S||!S.winner)return;const s=fresh(S.seats);s.turn=s.by=OTH[S.winner];s.rollId=S.rollId;commit(s)});
$('#copy').addEventListener('click',async()=>{const b=$('#copy'),link=location.href.split('#')[0]+'#'+code;
  try{if(navigator.share)await navigator.share({title:'Ludo',text:'Play Ludo with me',url:link});else{await navigator.clipboard.writeText(link);b.textContent='Copied'}}catch(e){}
  setTimeout(()=>{b.textContent='Invite'},1600)});

render();settle();
const l=store.get('ludo-last');if(l){$('#resume').hidden=false;$('#resume').textContent=`Resume game ${l}`}
const hc=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{5}$/.test(hc)){$('#codein').value=hc;join(hc)}
}
</script>
</body></html>
