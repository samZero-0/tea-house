<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm and playful, a family game night
   IDEA: a wooden ludo box opened on the table
   PICTURE: the board itself, large, with glossy pawns
   COLOUR and TYPE: walnut table, white board, classic red/green/yellow/blue; Baloo 2 + Nunito
   LAYOUT: each player's die sits beside their own base, red top-left, yellow bottom-right */
:root{color-scheme:dark;--bg:#24160d;--wood:#6b4125;--wood2:#4a2b17;--ink:#fff6ea;--muted:#dcc6ae;--card:#33200f;--line:#5c3b22;--R:#e0362f;--Y:#f2b200}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(1200px 700px at 30% 0%,#4a2c18 0%,var(--bg) 60%);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
.top{display:flex;justify-content:center;padding:14px 16px 0;min-height:14px}
h1{font:800 34px/1.05 "Baloo 2",system-ui,sans-serif;margin:0;letter-spacing:.5px}
h1 span{color:var(--Y)}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px}
.chip b{font:800 20px/1 "Baloo 2",sans-serif;letter-spacing:3px}
.chip small{color:var(--muted)}
.game{display:grid;grid-template-columns:auto minmax(0,620px) auto;gap:24px;justify-content:center;align-items:center;padding:14px max(3vw,12px) 20px;max-width:1040px;margin:0 auto}
.frame{aspect-ratio:1;width:100%;padding:clamp(8px,1.8vw,16px);background:linear-gradient(145deg,var(--wood),var(--wood2));border-radius:20px;box-shadow:0 24px 50px #0008,inset 0 2px 0 #ffffff22}
#board{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 0 0 2px #00000055}
.dslot{display:flex}.dslot.r{align-self:start;justify-content:flex-end}.dslot.y{align-self:end}.foot{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px 28px}.foot:empty{display:none}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;transition:border-color .2s,transform .2s}
.pl .nm{display:flex;align-items:center;gap:8px;font:800 19px/1.1 "Baloo 2",sans-serif}
.pl .nm i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 #0003}
.pl .who{color:var(--muted);font-size:14px}
.pl .home{font-size:14px;font-weight:700}
.pl.turn{transform:translateY(-2px)}
#pr.turn{border-color:var(--R)}#py.turn{border-color:var(--Y)}
.status{background:#fff6ea;color:#2a180b;border-radius:14px;padding:12px 14px;font-weight:700;min-height:72px}
.dieRow{display:flex;align-items:center;gap:18px}
.die{width:104px;height:104px;flex:none;border-radius:20px;background:#fff;border:5px solid var(--tc,#bbb);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;gap:3px;box-shadow:0 6px 0 #00000066;cursor:pointer;transition:border-color .2s}
.die i{border-radius:50%;background:#1b1b1b;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.die i.on{opacity:1;transform:scale(1)}
.die:disabled{cursor:default}.die.off{opacity:.28;transform:scale(.82)}.die{transition:opacity .25s,transform .25s}
.die:focus-visible,.btn:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--Y);outline-offset:3px}
.die.go{animation:bob 1.1s ease-in-out infinite}
.die.spin{animation:spin .55s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(.78)}100%{transform:rotate(360deg) scale(1)}}
.dieHint{color:var(--muted);font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:800 16px/1 Nunito,sans-serif;min-height:46px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--Y);border-color:var(--Y);color:#2a180b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:700 15px Nunito,sans-serif;cursor:pointer;min-height:44px;padding:0 4px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
summary{cursor:pointer;font-weight:800;min-height:28px}
details ul{margin:8px 0 2px;padding-left:18px;color:var(--muted)}
.note{color:#ffb4a8;font-size:14px;margin:0}.note:empty{display:none}
.tok{transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
.still .tok{transition:none}
.tok .ring{opacity:0}
.tok.can{cursor:pointer}
.tok.can .ring{opacity:1;animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.lobby{position:fixed;inset:0;background:#160d07cc;backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:5}
.lcard{width:min(420px,100%);background:#fff6ea;color:#2a180b;border-radius:22px;padding:26px 24px 18px;box-shadow:0 30px 60px #000a;display:flex;flex-direction:column;gap:12px}
.lcard h2{font:800 40px/1.05 "Baloo 2",sans-serif;margin:0}
.lcard p{margin:0}
.dots{display:flex;gap:8px}.dots i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -4px 0 #0003}
.or{text-align:center;color:#7a5a40;font-size:14px;font-weight:700;margin-top:4px}
.join{display:flex;gap:8px}
.join input{flex:1;font:800 22px/1 "Baloo 2",sans-serif;letter-spacing:4px;text-transform:uppercase;text-align:center;min-height:50px;border-radius:12px;border:2px solid #cdb79f;background:#fff;color:#2a180b;padding:0 10px}
.join input::placeholder{letter-spacing:1px;font-size:17px;color:#a58c74}
.lcard .btn{border-color:#2a180b;background:#2a180b;color:#fff6ea}
.lcard .btn.primary{background:var(--R);border-color:var(--R);color:#fff}
.lnote{color:#a3271f;font-weight:700;font-size:15px;min-height:1px}
.lcard .link{color:#6b4a30}
.lrow{display:flex;justify-content:space-between;flex-wrap:wrap}
@media(max-width:820px){.game{grid-template-columns:minmax(0,1fr);gap:14px}.frame{max-width:620px;margin:0 auto}.dslot{width:100%;max-width:620px;margin:0 auto}.dslot.r{justify-content:flex-start}.dslot.y{justify-content:flex-end}}
@media(max-width:420px){.die{width:78px;height:78px;padding:11px}.chip{margin-left:0}}
@media(prefers-reduced-motion:reduce){.tok,.die i{transition:none}.die.go,.die.spin,.tok.can .ring{animation:none}}
</style><script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
</head><body>
<header class="top"><div class="chip" id="codechip" hidden><b id="codetxt"></b><button class="btn" id="copy" style="min-height:36px;padding:0 12px">Invite</button></div></header>
<main class="game">
  <div class="dslot r"><button class="die" id="dier" aria-label="Red die" style="--tc:var(--R)" disabled></button></div>
  <div class="frame"><svg id="board" viewBox="0 0 15 15" role="img" aria-label="Ludo board"></svg></div>
  <div class="dslot y"><button class="die" id="diey" aria-label="Yellow die" style="--tc:var(--Y)" disabled></button></div>
</main>
<div class="foot"><p class="note" id="note"></p><button class="btn primary" id="again" hidden>Play again</button></div>
<div class="lobby" id="lobby">
  <div class="lcard">
    <div class="dots"><i style="background:#e0362f"></i><i style="background:#1f9d55"></i><i style="background:#f2b200"></i><i style="background:#2364d2"></i></div>
            <button class="btn primary" id="create">Create a game</button>
    
    <form class="join" id="joinf"><input id="codein" maxlength="5" placeholder="Code" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button class="btn" id="joinb">Join</button></form>
    <p class="lnote" id="lnote" role="status"></p>
    <div class="lrow"><button class="link" id="resume" hidden>Resume game</button><button class="link" id="localb">One device</button></div>
  </div>
</div>
<script>
{
const $=s=>document.querySelector(s);
const COL={r:'#e0362f',g:'#1f9d55',y:'#f2b200',b:'#2364d2'};
const DARK={r:'#8a1a15',y:'#8f6400'};
const NAME={r:'Red',y:'Yellow'};
const OFF={r:0,y:26},OTH={r:'y',y:'r'};
const CODESET='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
// 52-square main track as [row,col], starting at Red's start square
const T=[];
const run=(a,b,f)=>{const st=a<=b?1:-1;for(let k=a;st>0?k<=b:k>=b;k+=st)T.push(f(k))};
run(1,5,c=>[6,c]);run(5,0,r=>[r,6]);T.push([0,7]);run(0,5,r=>[r,8]);run(9,14,c=>[6,c]);T.push([7,14]);
run(14,9,c=>[8,c]);run(9,14,r=>[r,8]);T.push([14,7]);run(14,9,r=>[r,6]);run(5,0,c=>[8,c]);T.push([7,0]);T.push([6,0]);
const HOME={r:[1,2,3,4,5].map(c=>[7,c]),y:[13,12,11,10,9].map(c=>[7,c]),g:[1,2,3,4,5].map(r=>[r,7]),b:[13,12,11,10,9].map(r=>[r,7])};
const STARTS={0:'r',13:'g',26:'y',39:'b'};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const BASE={r:[[2,2],[4,2],[2,4],[4,4]],y:[[11,11],[13,11],[11,13],[13,13]]};
const FIN={r:[[6.4,7.05],[6.4,7.95],[6.4,7.5],[6.88,7.5]]};FIN.y=FIN.r.map(([x,y])=>[15-x,y]);

function rid(n,set='abcdefghijkmnpqrstuvwxyz23456789'){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,v=>set[v%set.length]).join('')}
const me=(()=>{try{let id=localStorage.getItem('ludo-me');if(!id){id=rid(14);localStorage.setItem('ludo-me',id)}return id}catch(e){return rid(14)}})();
const getLast=()=>{try{return localStorage.getItem('ludo-last')}catch(e){return null}};
const setLast=c=>{try{localStorage.setItem('ludo-last',c)}catch(e){}};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- board drawing ---------- */
const svg=$('#board');
const rect=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const cell=(r,c,f)=>`<rect x="${c}" y="${r}" width="1" height="1" fill="${f}" stroke="#2b2b2b" stroke-width=".035"/>`;
const star=(cx,cy,R,f)=>{let p='';for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?R*.45:R;p+=`${(cx+Math.cos(a)*rr).toFixed(3)},${(cy+Math.sin(a)*rr).toFixed(3)} `}return`<polygon points="${p}" fill="${f}"/>`};
let h=rect(0,0,15,15,'#fff');
[['r',0,0],['g',9,0],['y',9,9],['b',0,9]].forEach(([c,x,y])=>{
  h+=rect(x,y,6,6,COL[c])+rect(x+1,y+1,4,4,'#fff','rx=".35"');
  [[2,2],[4,2],[2,4],[4,4]].forEach(([a,b])=>{h+=`<circle cx="${x+a}" cy="${y+b}" r=".58" fill="${COL[c]}" opacity=".22" stroke="${COL[c]}" stroke-width=".07"/>`});
});
T.forEach(([r,c],i)=>{h+=cell(r,c,STARTS[i]?COL[STARTS[i]]:'#fff')});
for(const k in HOME)HOME[k].forEach(([r,c])=>{h+=cell(r,c,COL[k])});
SAFE.forEach(i=>{const[r,c]=T[i];h+=star(c+.5,r+.5,.36,STARTS[i]?'rgba(255,255,255,.85)':'#b9b9b9')});
h+=`<polygon points="6,6 6,9 7.5,7.5" fill="${COL.r}"/><polygon points="6,6 9,6 7.5,7.5" fill="${COL.g}"/><polygon points="9,6 9,9 7.5,7.5" fill="${COL.y}"/><polygon points="6,9 9,9 7.5,7.5" fill="${COL.b}"/>`;
h+=`<path d="M6 6L9 9M9 6L6 9" stroke="#2b2b2b" stroke-width=".035"/><rect x="0" y="0" width="15" height="15" fill="none" stroke="#2b2b2b" stroke-width=".08"/><g id="toks" class="still"></g>`;
svg.innerHTML=h;
const layer=$('#toks'),TK={};
['r','y'].forEach(c=>{TK[c]=[0,1,2,3].map(i=>{
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','tok');
  g.innerHTML=`<circle r=".62" fill="transparent"/><ellipse cx=".05" cy=".27" rx=".33" ry=".12" fill="rgba(0,0,0,.3)"/><circle class="ring" r=".52" fill="none" stroke="#111" stroke-width=".08"/><circle r=".37" fill="${COL[c]}" stroke="${DARK[c]}" stroke-width=".08"/><circle r=".2" fill="none" stroke="${DARK[c]}" stroke-width=".05" opacity=".6"/><circle cx="-.1" cy="-.12" r=".1" fill="#fff" opacity=".8"/>`;
  g.addEventListener('click',()=>onTok(c,i));layer.appendChild(g);return g})});

/* ---------- game state ---------- */
let S=null,mode=null,db=null,usr=null,ref=null,unsub=null,code=null,readOnly=false,queue=Promise.resolve(),shownRoll=-1;
const fresh=seats=>({v:1,seats,turn:'r',by:'r',dice:0,rollId:0,rolled:false,sixes:0,tk:{r:[-1,-1,-1,-1],y:[-1,-1,-1,-1]},winner:null,msg:'',ts:Date.now()});
const mine=c=>mode==='local'||(!!S&&S.seats[c]===me);
const myColor=()=>mode!=='online'||!S?null:S.seats.r===me?'r':S.seats.y===me?'y':null;
const ready=()=>!!S&&(mode==='local'||(!!S.seats.r&&!!S.seats.y));
const canAct=()=>ready()&&!S.winner&&!readOnly&&mine(S.turn);
const movable=(s,c,d)=>s.tk[c].map((p,i)=>(p<0?d===6:p+d<=56)?i:-1).filter(i=>i>=0);
const pass=s=>{s.turn=OTH[s.turn];s.rolled=false;s.sixes=0};

function pos(c,p,i){
  if(p<0)return BASE[c][i];
  if(p<=50){const[r,cc]=T[(OFF[c]+p)%52];return[cc+.5,r+.5]}
  if(p<=55){const[r,cc]=HOME[c][p-51];return[cc+.5,r+.5]}
  return FIN[c][i];
}

function commit(s){
  s.v=(S?S.v||0:0)+1;s.ts=Date.now();S=s;render();
  if(mode==='online')publish(s);
}

function roll(){
  if(!canAct()||S.rolled)return;
  const s=clone(S),c=s.turn,d=1+crypto.getRandomValues(new Uint32Array(1))[0]%6;
  s.dice=d;s.by=c;s.dv=Object.assign({r:0,y:0},s.dv);s.dv[c]=d;s.rollId++;s.sixes=d===6?s.sixes+1:0;s.msg='';
  if(s.sixes===3){s.msg=`${NAME[c]} rolled three 6s in a row and lost the turn.`;pass(s)}
  else{
    const m=movable(s,c,d);
    if(!m.length){s.msg=`${NAME[c]} rolled ${d} but had no move.`;pass(s)}
    else{s.rolled=true;
      if(new Set(m.map(i=>s.tk[c][i])).size===1){const id=s.rollId;setTimeout(()=>{if(S&&S.rollId===id&&S.rolled)move(m[0])},800)}}
  }
  commit(s);
}

function move(i){
  if(!canAct()||!S.rolled)return;
  const c=S.turn,d=S.dice;if(!movable(S,c,d).includes(i))return;
  const s=clone(S),p=s.tk[c][i],np=p<0?0:p+d;s.tk[c][i]=np;let cap=0;
  if(np<=50){const a=(OFF[c]+np)%52;if(!SAFE.has(a)){const o=OTH[c];s.tk[o]=s.tk[o].map(q=>q>=0&&q<=50&&(OFF[o]+q)%52===a?(cap++,-1):q)}}
  s.rolled=false;s.msg='';
  if(s.tk[c].every(q=>q===56)){s.winner=c;s.msg=`${NAME[c]} wins!`}
  else{
    if(cap)s.msg=`${NAME[c]} captured ${cap>1?cap+' tokens':'a token'}! Roll again.`;
    else if(np===56)s.msg=`${NAME[c]} got a token home! Roll again.`;
    else if(d===6)s.msg=`${NAME[c]} rolled a 6. Roll again.`;
    if(!(d===6||cap||np===56))pass(s);
  }
  commit(s);
}
function onTok(c,i){if(S&&S.turn===c&&S.rolled&&canAct())move(i)}

/* ---------- rendering ---------- */
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DICE={r:$('#dier'),y:$('#diey')};for(const c in DICE){DICE[c].innerHTML='<i></i>'.repeat(9);DICE[c].addEventListener('click',()=>{if(S&&S.turn===c)roll()})}
function render(){
  // tokens
  const tk=S?S.tk:{r:[-1,-1,-1,-1],y:[-1,-1,-1,-1]},groups={},all=[];
  ['r','y'].forEach(c=>tk[c].forEach((p,i)=>{const[x,y]=pos(c,p,i);const k=p<0||p===56?c+i+'_'+p:x+','+y;(groups[k]=groups[k]||[]).push(c+i);all.push([c,i,x,y,k,p])}));
  const mv=S&&S.rolled&&canAct()?movable(S,S.turn,S.dice):[];
  all.forEach(([c,i,x,y,k,p])=>{
    const gr=groups[k],g=TK[c][i];let dx=0,dy=0,sc=p===56?.6:1;
    if(gr.length>1){const a=gr.indexOf(c+i)/gr.length*Math.PI*2+Math.PI/4;dx=Math.cos(a)*.22;dy=Math.sin(a)*.22;sc=.72}
    g.style.transform=`translate(${(x+dx).toFixed(3)}px,${(y+dy).toFixed(3)}px) scale(${sc})`;
    const can=S&&S.turn===c&&mv.includes(i);
    if(can&&!g.classList.contains('can'))layer.appendChild(g);
    g.classList.toggle('can',!!can);
  });
  // die
  const canRoll=!!S&&canAct()&&!S.rolled;
  for(const c in DICE){const d=DICE[c],v=S&&S.dv?S.dv[c]||0:0,active=!!S&&!S.winner&&ready()&&S.turn===c;
    [...d.children].forEach((p,k)=>p.classList.toggle('on',PIPS[v].includes(k)));
    d.classList.toggle('off',!active);d.disabled=!(canRoll&&active);d.classList.toggle('go',canRoll&&active);
    if(S&&shownRoll!==-1&&S.rollId!==shownRoll&&S.by===c){d.classList.remove('spin');void d.offsetWidth;d.classList.add('spin')}}
  shownRoll=S?S.rollId:-1;
  $('#codechip').hidden=!(mode==='online'&&S&&!S.seats.y);
  $('#again').hidden=!(S&&S.winner&&(mode==='local'||myColor()));
}
function statusText(){
  if(!S)return'Create or join a game to begin.';
  if(mode==='online'&&!S.seats.y)return`Send the code ${code} to your friend. The game starts when they join.`;
  if(S.winner)return mode==='local'?`${NAME[S.winner]} wins the game!`:S.winner===myColor()?'You win! All four tokens are home.':'Your friend wins this one. Play again?';
  if(mode==='online'&&!myColor())return'You are watching. This game already has two players.';
  if(readOnly)return'You are watching only.';
  const c=S.turn,lead=S.msg?S.msg+' ':'';
  if(!mine(c))return`${lead}Waiting for your friend (${NAME[c]}) to play.`;
  if(S.rolled)return`Tap a glowing ${NAME[c].toLowerCase()} token to move ${S.dice}.`;
  return`${lead}${mode==='local'?NAME[c]+"'s turn":'Your turn ('+NAME[c]+')'}. Roll the die.`;
}
const note=t=>{$('#note').textContent=t||''};
const lnote=t=>{$('#lnote').textContent=t||''};
const busyL=b=>{$('#create').disabled=b;$('#joinb').disabled=b};
const errMsg=e=>e&&e.code==='invalid_argument'?'You can only view this page, so you cannot start or join a game. Ask whoever shared it to invite you as an Editor.':e&&e.code==='quota_exceeded'?'The game store is full right now.':'Could not reach the game server. Check your connection and try again.';

/* ---------- lobby and sync (public MQTT relay, two brokers for safety) ---------- */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let clients=[],topic=null,joinWait=null;
function netClose(){clients.forEach(c=>{try{c.end(true)}catch(e){}});clients=[];topic=null}
function netOpen(c){
  netClose();topic='ludo2p/v1/'+c;
  clients=BROKERS.map(u=>{const m=mqtt.connect(u,{clientId:'ludo_'+rid(12),clean:true,connectTimeout:8000,reconnectPeriod:2500,keepalive:30});
    m.on('connect',()=>{m.subscribe(topic,{qos:1});if(m.pend){const x=m.pend;m.pend=null;m.publish(topic,x,{qos:1,retain:true})}});
    m.on('message',(t,buf)=>{if(t!==topic)return;let d;try{d=JSON.parse(buf.toString())}catch(e){return}if(!d||!d.tk||!d.seats)return;onRemote(d)});
    m.on('error',()=>{});return m});
}
function publish(s){const msg=JSON.stringify(s);clients.forEach(m=>{if(!m.connected){m.pend=msg;return}try{m.publish(topic,msg,{qos:1,retain:true})}catch(e){m.pend=msg}})}
function onRemote(d){
  if(joinWait){const f=joinWait;joinWait=null;f(d);return}
  if(S&&(d.v||0)<=(S.v||0))return;
  S=clone(d);render();settle();
}
function create(){
  if(!window.mqtt){lnote('Could not load the online part. Check your internet and reload.');return}
  const c=rid(5,CODESET);mode='online';code=c;setLast(c);S=fresh({r:me,y:null});
  netOpen(c);publish(S);show(c);
}
function join(raw){
  const c=(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{5}$/.test(c)){lnote('A game code is 5 letters or numbers.');return}
  if(!window.mqtt){lnote('Could not load the online part. Check your internet and reload.');return}
  lnote('Joining...');busyL(true);S=null;mode='online';code=c;
  const timer=setTimeout(()=>{if(joinWait){joinWait=null;netClose();mode=null;busyL(false);lnote('No game found with that code. Check it with your friend.')}},9000);
  joinWait=d=>{clearTimeout(timer);busyL(false);lnote('');
    if(d.seats.r!==me&&d.seats.y!==me){
      if(d.seats.y){S=clone(d);show(c);note('This game already has two players. You are watching.');return}
      const s=clone(d);s.seats.y=me;s.v=(d.v||0)+1;s.msg='';S=s;publish(s)}
    else S=clone(d);
    setLast(c);show(c)};
  netOpen(c);
}
function show(c){$('#lobby').hidden=true;$('#codetxt').textContent=c;shownRoll=-1;try{history.replaceState(null,'','#'+c)}catch(e){}render();settle()}
function startLocal(){
  netClose();mode='local';code=null;shownRoll=-1;note('');
  S=fresh({r:'local',y:'local'});$('#lobby').hidden=true;$('#codechip').hidden=true;render();settle();
}
function settle(){requestAnimationFrame(()=>requestAnimationFrame(()=>layer.classList.remove('still')))}

$('#create').addEventListener('click',create);
$('#joinf').addEventListener('submit',e=>{e.preventDefault();join($('#codein').value)});
$('#codein').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
$('#localb').addEventListener('click',startLocal);
$('#resume').addEventListener('click',()=>join(getLast()));
$('#again').addEventListener('click',()=>{if(!S||!S.winner)return;const s=fresh(S.seats);s.turn=s.by=OTH[S.winner];s.rollId=S.rollId;commit(s)});
$('#copy').addEventListener('click',async()=>{const b=$('#copy');const link=location.href.split('#')[0]+'#'+code;
  try{if(navigator.share){await navigator.share({title:'Ludo',text:'Play Ludo with me',url:link})}else{await navigator.clipboard.writeText(link);b.textContent='Copied'}}catch(e){}
  setTimeout(()=>{b.textContent='Invite'},1600)});

render();settle();busyL(false);
const l=getLast();if(l){$('#resume').hidden=false;$('#resume').textContent=`Resume game ${l}`}
const hc=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{5}$/.test(hc)){$('#codein').value=hc;join(hc)}
}
</script>
</body></html>
